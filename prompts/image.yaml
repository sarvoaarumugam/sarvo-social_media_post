# ============================================================
#  IMAGE PROMPTS  (the "cover art" stage — sent to gpt-image-1)
#  The AI makes the BACKGROUND only; the app overlays the title text
#  afterwards, so we tell the model: absolutely no text in the image.
# ============================================================

# First-time generation from the topic.
# Placeholders: $topic $brand $style
generation: |
  Create a striking, high-quality 16:9 cover background image for a podcast episode about: "$topic".
  Visual style: $style.
  Composition: cinematic and clean, with a single clear focal subject that visually represents the topic, and calm, uncluttered negative space toward the center and lower third so a title can be overlaid later.
  Lighting: rich, dramatic and professional. Color palette: cohesive and bold, matching the mood of the topic.
  Make it look like a premium, scroll-stopping YouTube thumbnail — modern, crisp, high detail.
  Absolutely NO text, NO letters, NO numbers, NO words, NO logos, and NO watermarks anywhere in the image.

# Re-generation when the user wants changes. Their request is in $feedback.
# Placeholders: $topic $brand $style $feedback
regeneration: |
  Create a NEW version of a striking 16:9 cover background image for a podcast episode about: "$topic".
  Visual style: $style.
  Apply these specific changes the user asked for: $feedback
  Keep it cinematic, premium and clean, with calm negative space toward the center and lower third for a title overlay.
  Absolutely NO text, NO letters, NO numbers, NO words, NO logos, and NO watermarks anywhere in the image.
